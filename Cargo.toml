[package]
name = "scrannotate"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Screenshot annotation tool: capture a screen, select, annotate in place, copy or save"
license = "Apache-2.0"
authors = ["Jason Garber <jgarber@appcove.com>"]
homepage = "https://github.com/appcove/scrannotate"
repository = "https://github.com/appcove/scrannotate"
readme = "README.md"
keywords = ["screenshot", "annotation", "screen-capture", "cross-platform", "wayland"]
categories = ["multimedia::images", "gui"]

[features]
default = ["capture"]
# The pinray capture backend. Building it on Linux needs libpipewire-0.3-dev,
# clang, and pkg-config; macOS and Windows need no system packages. Off, only
# --from-file works — useful for developing the UI on a machine without
# PipeWire headers.
capture = ["dep:pinray", "dep:tracing", "dep:tracing-subscriber"]
# Native security-scoped file access for the separately signed Mac App Store build.
mac-app-store = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[dependencies]
anyhow = "1.0.103"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
chrono = "0.4"
clap = { version = "4.6.1", features = ["derive"] }
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pinray = { version = "0.2.4", optional = true }
tiny-skia = "0.12.0"

# Narrow native fixes until pinray includes correct display metadata and a
# macOS 12.3-compatible screenshot configuration. See vendor/README.md.
[patch.crates-io]
pinray-platform-macos = { path = "vendor/pinray-platform-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
# Only for catching pinray's portal restore token (capture/screencast.rs).
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
dirs = "7.0.0"
rfd = { version = "0.17.2", default-features = false }
# The same winit eframe uses — direct access for matching the captured
# monitor and for macOS "simple fullscreen" (app.rs, main.rs).
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
# AttachConsole, so the windows-subsystem binary still prints in a terminal;
# GetCurrentPackagePath, to find bundled notices inside the MSIX package.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_Packaging_Appx"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"], optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "NSRunningApplication"], optional = true }

[profile.dev]
# The image/pixelate paths are unusably slow at opt-level 0 on 4K+ screenshots.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
