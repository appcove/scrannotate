# Validation and packaging use one immutable commit. Drafts can be resumed
# only at their original commit, and all six targets must pass before upload.
name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/**
      - scripts/**
      - packaging/**
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.3"

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Create or resume the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/prepare_release.py --source-sha "$SOURCE_SHA"

  validate:
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare-release.outputs.source_sha }}

  upload-assets:
    needs: [prepare-release, validate]
    if: needs.prepare-release.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install PipeWire build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev clang pkg-config
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build the release executable
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Generate dependency notices
        run: python scripts/third_party_notices.py --target "${{ matrix.target }}" --output target/THIRD_PARTY_NOTICES.txt
      - name: Sign the macOS executable
        if: runner.os == 'macOS'
        run: codesign --force --sign - "target/${{ matrix.target }}/release/scrannotate"
      - name: Package executable and notices
        run: |
          binary="target/${{ matrix.target }}/release/scrannotate"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="$binary.exe"
          fi
          python scripts/package_release.py --binary "$binary" \
            --target "${{ matrix.target }}" --source-sha "$SOURCE_SHA" \
            --notices target/THIRD_PARTY_NOTICES.txt
      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          archive="scrannotate-${{ matrix.target }}.app.zip"
          packaging/macos/bundle.sh \
            "target/${{ matrix.target }}/release/scrannotate" \
            "$RELEASE_VERSION" "dist/$archive" target/THIRD_PARTY_NOTICES.txt
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    needs: [prepare-release, validate, upload-assets]
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          persist-credentials: false
      - name: Recheck source and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: python scripts/prepare_release.py --source-sha "$SOURCE_SHA" --publish
