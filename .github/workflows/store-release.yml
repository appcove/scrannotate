# Store publishing (Mac App Store + Microsoft Store). MANUAL and OPT-IN.
#
# This never runs on push. Trigger it from the Actions tab. Each platform job
# runs only if its signing secrets are configured (see docs/SIGNING.md), so
# the workflow is a safe no-op until you set them up. It BUILDS and (for
# macOS) uploads to App Store Connect; the Microsoft Store MSIX is uploaded to
# Partner Center by hand from the artifact unless you wire the Store
# Submission API yourself.
#
# Prerequisite before either job produces a shippable package: add the app
# icon assets (docs/SIGNING.md → "Prerequisite: an app icon").

name: Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (defaults to Cargo.toml)"
        required: false
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Secrets are not usable in job-level `if:`, so surface their presence as
  # booleans here and gate the real jobs on these outputs.
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      mac: ${{ steps.check.outputs.mac }}
      win: ${{ steps.check.outputs.win }}
    steps:
      - id: check
        env:
          MAS_APP_CERT: ${{ secrets.MAS_APP_CERT }}
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
        run: |
          [[ -n "$MAS_APP_CERT" ]] && echo "mac=true" >> "$GITHUB_OUTPUT" || echo "mac=false" >> "$GITHUB_OUTPUT"
          [[ -n "$MSIX_IDENTITY_NAME" ]] && echo "win=true" >> "$GITHUB_OUTPUT" || echo "win=false" >> "$GITHUB_OUTPUT"

  mac-app-store:
    needs: preflight
    if: needs.preflight.outputs.mac == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name=="scrannotate") | .version')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Import signing certs & provisioning profile
        env:
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISION_BASE64: ${{ secrets.MAS_PROVISION_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$MAS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$keychain" >/dev/null
          echo "$MAS_PROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/scrannotate.provisionprofile"
      - name: Build universal binary
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p "$RUNNER_TEMP/bin"
          lipo -create -output "$RUNNER_TEMP/bin/scrannotate" \
            target/aarch64-apple-darwin/release/scrannotate \
            target/x86_64-apple-darwin/release/scrannotate
      - name: Package .pkg
        env:
          MAS_APP_CERT: ${{ secrets.MAS_APP_CERT }}
          MAS_INSTALLER_CERT: ${{ secrets.MAS_INSTALLER_CERT }}
        run: |
          export MAS_PROVISION="$RUNNER_TEMP/scrannotate.provisionprofile"
          packaging/macos/mas-package.sh "$RUNNER_TEMP/bin/scrannotate" \
            "${{ steps.v.outputs.version }}" dist/scrannotate-mas.pkg
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f dist/scrannotate-mas.pkg -t macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: scrannotate-mas-pkg
          path: dist/*.pkg

  microsoft-store:
    needs: preflight
    if: needs.preflight.outputs.win == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version (four-part)
        id: v
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name=="scrannotate") | .version')"
          fi
          echo "version=${version}.0" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked
      - name: Package MSIX (unsigned — the Store signs on upload)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          packaging/windows/build-msix.ps1 -Exe target/release/scrannotate.exe `
            -Version "${{ steps.v.outputs.version }}" -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: scrannotate-msix-${{ matrix.arch }}
          path: dist/*.msix
