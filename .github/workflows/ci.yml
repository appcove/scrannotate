# Build + clippy + test on every OS/architecture a release targets.
#
# Linux needs libpipewire-0.3-dev >= 1.x for the capture backend — that is
# why ubuntu-24.04 is the floor (22.04 ships PipeWire 0.3.48, which the
# libspa crate no longer compiles against).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15 # arm64; pinned so runner migrations do not change CI underneath us
          - macos-15-intel # x86_64
          - windows-latest # x86_64
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install PipeWire build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev clang pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Clippy without the capture backend (UI-only dev build)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

      # Pull requests only: an optimized build to hand to a reviewer. Pushes
      # skip it — clippy --all-targets and the tests already compile the
      # whole tree, and nothing downloads a push's artifacts.
      - name: Build for PR testing
        if: github.event_name == 'pull_request'
        run: cargo build --release --locked
      - name: Stage the download
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            version="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "scrannotate") | .version')"
            packaging/macos/bundle.sh target/release/scrannotate "$version" \
              "dist/scrannotate-macos-$RUNNER_ARCH.app.zip"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p dist && cp target/release/scrannotate.exe dist/
          else
            mkdir -p dist && cp target/release/scrannotate dist/
          fi
      - name: Upload PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scrannotate-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          retention-days: 14
